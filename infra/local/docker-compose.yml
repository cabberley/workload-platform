# Local all-up stack for development. CI smoke-tests /api/health against this.
services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src
      # Local/CI dev stack runs without Entra auth by explicit opt-out (fail-closed default
      # is `required`, which would otherwise refuse to serve without tenant/audience config).
      WP_AUTH_MODE: disabled

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - api

  # Example one-shot worker run (a module as it runs in an ACA Job). Not started by default.
  discovery:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    command: ["--module", "discovery"]
    environment:
      # Match the api service: no keyless bearer minting in the local/CI dev stack.
      WP_AUTH_MODE: disabled
    profiles: ["workers"]
