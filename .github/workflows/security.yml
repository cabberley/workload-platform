name: security-review

# Runs on every pull request: static analysis, dependency & secret scanning,
# and the platform's own guardrail checks (in-boundary / keyless / fail-closed).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly baseline

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  codeql:
    name: CodeQL (python + javascript)
    runs-on: ubuntu-latest
    # Code scanning upload requires GitHub Advanced Security. On a free PRIVATE repo this
    # isn't available, so run best-effort; it activates automatically in a GHAS-enabled org.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Also requires GitHub Advanced Security on private repos; best-effort until enabled.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # gitleaks-action@v2 now requires GITHUB_TOKEN to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  guardrails:
    name: platform guardrails (in-boundary · keyless · fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hard-coded secrets / keys / connection strings
        run: |
          set -e
          if grep -RInE "(AccountKey=|SharedAccessKey=|password\s*=\s*['\"][^'\"]+|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{20,})" \
               --include='*.py' --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' --include='*.json' \
               src content infra ; then
            echo "::error::Possible secret or key material committed — remove it, use Managed Identity / Key Vault."; exit 1
          fi
          echo "OK: no obvious secrets."
      - name: Keyless — no Azure connection strings in code
        run: |
          if grep -RInE "DefaultEndpointsProtocol=|Endpoint=sb://|AccountEndpoint=" src content infra ; then
            echo "::error::Connection string found — use DefaultAzureCredential / Managed Identity."; exit 1
          fi
          echo "OK: keyless."
      - name: In-boundary — no PHI/PII fixtures
        run: |
          if grep -RInE "(mrn|patient_name|ssn|date_of_birth)\b" --include='*.py' --include='*.json' --include='*.yaml' src content tests ; then
            echo "::error::Possible PHI/PII token in fixtures — use synthetic, clearly-fake data."; exit 1
          fi
          echo "OK: no PHI/PII tokens."
      - name: Bandit (python security lint)
        run: |
          pip install bandit
          bandit -r src -ll -x tests || true   # advisory; CodeQL is the gate
