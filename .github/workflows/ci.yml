name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Ruff (lint + format check)
        run: ruff check src tests
      - name: Mypy (types)
        run: mypy src
      - name: Pytest (pure logic, no Azure needed)
        env:
          PYTHONPATH: src
        run: pytest -q --cov=src --cov-report=term-missing

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - working-directory: src/web
        run: |
          npm ci || npm install
          npm run build --if-present

  smoke:
    name: compose smoke (/api/health)
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - name: Build & start stack
        run: docker compose -f infra/local/docker-compose.yml up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; docker compose -f infra/local/docker-compose.yml logs; exit 1
      - name: Tear down
        if: always()
        run: docker compose -f infra/local/docker-compose.yml down -v
