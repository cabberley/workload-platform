[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workloads-platform"
version = "0.1.0"
description = "In-boundary, AI-native platform for discovering, validating and observing multi-layer Azure workloads (codename Aegis)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - Internal Microsoft" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "azure-mgmt-resourcegraph>=8.0",
    "azure-monitor-query>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
# Optional backend deps for the Azure StateStore (WORKLOADS_STATE_BACKEND=azure).
# NOT part of the base install — `import shared.state` must work without azure packages.
# Install with: pip install .[azure]
azure = [
    "azure-data-tables",
    "azure-storage-blob",
    "azure-identity",
]

[project.scripts]
wp-worker = "cli.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # allow asserts in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["shared", "api", "modules", "packs_engine", "cli"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
